<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regisztráció</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Regisztráció</h1>

    <form action="feldolgozas.php" method="POST" id="regForm">

        
        <div class="mb-3">
            <label for="nev" class="form-label">Név</label>
            <input type="text" class="form-control" id="nev" name="nev" required>
        </div>

        
        <div class="mb-3">
            <label for="loginnév" class="form-label">Loginnév</label>
            <input type="text" class="form-control" id="loginnév" name="loginnév" required>
        </div>

        
        <div class="mb-3">
            <label for="jelszo" class="form-label">Jelszó</label>
            <input type="password" class="form-control" id="jelszo" name="jelszo" maxlength="25" required>
        </div>

        
        <div class="mb-3">
            <label for="szerepkor" class="form-label">Szerepkör</label>

            <select class="form-select" id="szerepkor" name="szerepkor" required>

                <option value="">Válassz szerepkört!</option>
                <option value="felhasználó">Felhasználó</option>
                <option value="admin">Admin</option>
                <option value="karbantartó">Karbantartó</option>

            </select>
        </div>

        
        <div class="mb-3">
            <label class="form-label">Autó</label>

            <div>
                <input type="radio" class="form-check-input" id="auto_van" name="auto" value="1" checked>

                <label for="auto_van" class="form-check-label">
                    Van
                </label>
            </div>

            <div>
                <input type="radio" class="form-check-input" id="auto_nincs" name="auto" value="0">

                <label for="auto_nincs" class="form-check-label">
                    Nincs
                </label>
            </div>
        </div>

        
        <div class="mb-3">
            <label class="form-label">PC</label>

            <div>
                <input type="radio" class="form-check-input" id="pc_van" name="pc" value="1">

                <label for="pc_van" class="form-check-label">
                    Van
                </label>
            </div>

            <div>
                <input type="radio" class="form-check-input" id="pc_nincs" name="pc" value="0" checked>

                <label for="pc_nincs" class="form-check-label">
                    Nincs
                </label>
            </div>
        </div>

        
        <div class="mb-3">
            <label for="mobil" class="form-label">Mobil</label>

            <input type="text" class="form-control" id="mobil" name="mobil" required>

            <div id="mobilHiba" class="text-danger"></div>
        </div>

        
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>

            <input type="text" class="form-control" id="email" name="email" required>

            <div id="emailHiba" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-primary">
            Küldés
        </button>

        <button type="reset" class="btn btn-secondary">
            Mégsem
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
